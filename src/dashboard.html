<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cloudy Cloud dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #fafafb; --surface: #fff; --subtle: #f4f4f6; --border: #e6e6ea; --text: #17181c; --text-2: #4d505a; --text-3: #666974; --accent: #4f5ee8;
    --s-running: #1f9d5c; --s-starting: #b7791f; --s-queued: #8b8e98; --s-idle: #3b82c4; --s-failed: #c42b33; --s-stopped: #8b8e98;
    --t-running: #15804a; --t-starting: #8f5d10; --t-idle: #2f6fae;
    --warn-text: #8a5a00; --warn-bg: #fdf6e3; --err-bg: #fdecee; --pop: 0 1px 2px rgba(20,20,30,.08), 0 4px 12px rgba(20,20,30,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0c0d10; --surface: #131418; --subtle: #1a1b20; --border: #24252c; --text: #ececf1; --text-2: #a0a3ad; --text-3: #858893; --accent: #8b96ff;
      --s-running: #3ecf8e; --s-starting: #f0b54a; --s-idle: #6cb0f0; --s-failed: #ff6b72;
      --t-running: #3ecf8e; --t-starting: #f0b54a; --t-idle: #6cb0f0;
      --warn-text: #f0b54a; --warn-bg: #2a2310; --err-bg: #2d1517; --pop: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--page); }
  body { background: var(--page); color: var(--text); font: 400 13px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .mono, code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  [hidden] { display: none !important; }

  /* status colours: .sd is the dot, .st the text */
  .sd { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--s-stopped); }
  .sd.queued { background: var(--s-queued); } .sd.starting { background: var(--s-starting); } .sd.running { background: var(--s-running); } .sd.idle { background: var(--s-idle); } .sd.failed { background: var(--s-failed); }
  .sd.running { animation: ring 2.4s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s-running) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 6px transparent; } }
  .st, .st.queued { color: var(--text-3); } .st.starting { color: var(--t-starting); } .st.running { color: var(--t-running); } .st.idle { color: var(--t-idle); } .st.failed { color: var(--s-failed); }

  header { flex: none; display: flex; align-items: center; gap: 16px; min-height: 48px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1; white-space: nowrap; }
  .brand svg { height: 16px; width: 23px; }
  .brand b { font-weight: 600; }
  .summary .spend { color: var(--text-3); }
  .summary { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; margin-left: 8px; font-size: 12px; color: var(--text-2); }
  .stat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .stat b { font-weight: 500; color: var(--text); }
  .stat.failed, .stat.failed b { color: var(--s-failed); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .live .sd { background: var(--s-running); }
  .live.off .sd { background: var(--s-failed); animation: none; }
  .live.wait .sd { background: var(--s-queued); animation: none; }
  .tag { font-size: 11px; font-weight: 500; line-height: 1; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-3); }
  .toggle { display: inline-flex; padding: 2px; gap: 2px; border-radius: 6px; background: var(--subtle); border: 1px solid var(--border); }
  .toggle button { height: 24px; padding: 0 12px; border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--text-2); border: 1px solid transparent; }
  .toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--pop); }

  .banner { flex: none; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 6px 16px; font-size: 13px; border-bottom: 1px solid var(--border); background: var(--err-bg); }
  .banner::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--s-failed); }
  .banner.warn { background: var(--warn-bg); }
  .banner .fix { display: block; }
  main.stale .sd, main.stale .ev.work::before { animation: none; }
  .banner.warn::before { background: var(--s-starting); }
  .banner code { background: var(--subtle); padding: 1px 6px; border-radius: 4px; user-select: all; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px 1fr; }
  .rail { min-height: 0; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); }
  .grp { position: sticky; top: 0; z-index: 1; display: flex; gap: 6px; padding: 12px 16px 6px; font-size: 12px; font-weight: 500; line-height: 1.3; color: var(--text-2); background: var(--surface); }
  .grp span { color: var(--text-3); }

  .row { position: relative; display: block; width: 100%; text-align: left; cursor: pointer; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .row:hover { background: var(--subtle); }
  .row[aria-selected="true"] { background: var(--subtle); }
  .row[aria-selected="true"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
  .l1 { display: flex; align-items: center; gap: 8px; }
  .title { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rel { flex: none; font: 400 12px/1 "JetBrains Mono", monospace; color: var(--text-3); }
  .l2, .l3 { margin: 2px 0 0 16px; font-size: 12px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l2 { color: var(--text-3); }
  .l3 { color: var(--text-2); }
  .l3 b { font-weight: 500; color: var(--text); }
  .l2 .mono { font-size: 12px; }
  .l2 .st { font-weight: 500; }
  .soon { color: var(--warn-text); font-weight: 500; }
  .tile .soon { font-size: 12px; }
  .l3.err { color: var(--s-failed); }

  .branch { display: inline-flex; align-items: center; gap: 4px; font: 400 12px/1.4 "JetBrains Mono", monospace; min-width: 0; }
  .branch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; color: var(--text-3); flex: none; }
  .copy:hover { background: var(--subtle); color: var(--text); }
  .copy svg { width: 14px; height: 14px; }

  .panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; font-size: 14px; }
  .panel-head { flex: none; padding: 20px 32px; border-bottom: 1px solid var(--border); }
  .crumb { font-size: 12px; color: var(--text-3); }
  .panel-head h1 { font: 600 20px/1.3 "Inter Tight", Inter, sans-serif; letter-spacing: -.01em; margin: 4px 0 0; }
  .props { grid-auto-flow: row dense; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 24px; margin-top: 16px; }
  .prop { min-width: 0; }
  .pv.note { white-space: normal; align-items: flex-start; }
  .prop.full { grid-column: 1 / -1; }
  .prop.wide { grid-column: span 2; }
  .props.cmds { grid-template-columns: minmax(0, 1fr); gap: 4px; margin-top: 12px; }
  .cmds .prop { display: flex; gap: 12px; align-items: baseline; }
  .cmds .pl { flex: none; width: 64px; margin: 0; }
  .kindrep { display: none; }
  .hint { color: var(--text-3); font-size: 12px; }
  .usage { margin-top: 12px; display: grid; gap: 6px; font-size: 13px; }
  .usage .pl { margin: 0; }
  .usage svg.spark { width: 100%; height: 48px; display: block; background: var(--subtle); border-radius: 6px; }
  .usage svg.spark polyline { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .usage .cpu { stroke: var(--accent); } .usage .mem { stroke: var(--text-2); stroke-dasharray: 4 3; }
  .usage .key { color: var(--text-3); font-size: 12px; }
  .usage .fine { color: var(--text-3); font-size: 12px; } .usage details.fine summary { cursor: pointer; }
  .usage .axis { display: flex; justify-content: space-between; color: var(--text-3); font-size: 12px; margin-top: -2px; }
  .usage .prop .pv { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .usage .prop { display: flex; gap: 12px; align-items: baseline; } .usage .prop .pl { flex: none; width: 64px; }
  .push.failed { color: var(--s-failed); }
  .pl { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
  .pv { font-size: 13px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel-head h1:focus { outline: none; }
  .back { display: none; margin: -4px 0 4px -12px; color: var(--accent); font-size: 13px; font-weight: 500; padding: 8px 12px; }
  .seclabel { flex: none; padding: 16px 32px 0; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 32px 32px; }
  .tl { position: relative; max-width: 760px; display: flex; flex-direction: column; gap: 12px; padding-left: 24px; }
  .tl::before { content: ""; position: absolute; left: 4px; top: 8px; bottom: 8px; width: 1px; background: var(--border); }
  .ev { position: relative; }
  .ev::before { content: ""; position: absolute; left: -24px; top: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--page); border: 1px solid var(--text-3); }
  .ev.out::before { border-color: var(--accent); }
  .ev.reply::before { border-color: var(--s-running); }
  .ev.reply.err::before { border-color: var(--s-failed); }
  .run { display: flex; flex-direction: column; }
  .ev.prog { display: flex; align-items: center; gap: 8px; height: 26px; }
  .ev.prog::before { left: -22px; top: 11px; width: 5px; height: 5px; background: var(--text-3); border: 0; }
  .chip { flex: none; min-width: 56px; text-align: center; padding: 2px 6px; border-radius: 4px; background: var(--subtle); font: 400 11px/1.4 "JetBrains Mono", monospace; color: var(--text); }
  .ptxt { flex: 1; min-width: 0; font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.prog.now::before { background: var(--accent); }
  .ev.prog.now .ptxt { color: var(--text); }
  .wlink { color: var(--accent); font-weight: 500; text-decoration: underline; }
  .ptime, .btime { flex: none; font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--text-3); }
  .blk { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; background: var(--surface); }
  .ev.out .blk { background: var(--subtle); }
  .ev.err .blk { border-left: 3px solid var(--s-failed); }
  .bh { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; font-size: 12px; color: var(--text-2); }
  .ev.err .bh > span { color: var(--s-failed); }
  .bb { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ev.work { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); height: 26px; }
  .ev.work::before { width: 7px; height: 7px; left: -23px; top: 9px; border: 0; background: var(--accent); animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  .row.child { padding-left: 36px; }
  .row.child::after { content: ""; position: absolute; left: 22px; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .chev { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin: -2px -4px -2px -6px; border-radius: 4px; color: var(--text-3); font-size: 14px; }
  .chev:hover { background: var(--border); color: var(--text); }
  .subbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 32px 0; }
  .subbar .seclabel { padding: 0; }
  .tabs { display: inline-flex; gap: 2px; }
  .tab { height: 28px; padding: 0 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); border: 1px solid transparent; }
  .tab[aria-selected="true"] { background: var(--subtle); color: var(--text); border-color: var(--border); }
  .turns { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-3); }
  .tb { min-width: 28px; height: 24px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
  .tb[aria-pressed="true"] { background: var(--subtle); color: var(--text); font-weight: 600; }
  .badge { margin-left: auto; font-size: 12px; color: var(--text-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; line-height: 1.3; }
  .badge.bad { color: var(--warn-text); background: var(--warn-bg); border-color: transparent; }
  .badge.live { color: var(--t-running); }
  .sub { margin: 16px 0 4px -24px; font-size: 12px; color: var(--text-3); }
  .note { font-size: 13px; color: var(--text-2); background: var(--subtle); border-radius: 8px; padding: 10px 14px; }
  .ev.text .blk { background: var(--surface); }
  .ev.tool .th { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ev.tool .th .chip { min-width: 0; }
  .tin { margin-top: 4px; padding: 8px 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); border-radius: 6px; background: var(--subtle); color: var(--text); }
  .more { margin-top: 4px; padding: 4px 8px; margin-left: -8px; font-size: 12px; font-weight: 500; color: var(--accent); border-radius: 4px; }
  .ev.res .rl { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  .rtag { flex: none; font: 500 11px/1.4 "JetBrains Mono", monospace; }
  .res.ok .rtag { color: var(--t-running); } .res.err .rtag { color: var(--s-failed); }
  .rtxt { flex: 1; min-width: 0; font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rtxt.open { white-space: pre-wrap; overflow-wrap: anywhere; overflow: visible; }
  .ev.res::before { width: 5px; height: 5px; left: -22px; top: 7px; border: 0; background: var(--t-running); }
  .ev.res.err::before { background: var(--s-failed); }
  .ev.warn .rl, .ev.bad .rl { display: flex; gap: 8px; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
  .ev.warn .rl { background: var(--warn-bg); color: var(--warn-text); } .ev.bad .rl { background: var(--err-bg); color: var(--s-failed); }
  .ev.warn .rtxt, .ev.bad .rtxt { color: inherit; }
  .ev.warn::before { border-color: var(--s-starting); } .ev.bad::before, .ev.fin.err::before { border-color: var(--s-failed); }
  .ev.think { font-size: 12px; color: var(--text-3); } .ev.think summary { cursor: pointer; padding: 2px 0; }
  .ev.fin::before { border-color: var(--s-running); }
  .term { max-width: 960px; }
  .termnote { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 8px; font-size: 12px; color: var(--text-2); }
  .tpre { padding: 12px 16px; max-height: calc(100dvh - 320px); min-height: 160px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--border); border-radius: 8px; background: var(--subtle); color: var(--text); }
  .grp.sub2 { position: static; padding: 12px 0 6px; }
  .fleet { grid-column: 1 / -1; overflow-y: auto; padding: 8px 24px 24px; }
  .fleet .grp { padding: 16px 0 8px; background: var(--page); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 12px 14px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
  .tile.failed { border-color: var(--s-failed); background: var(--err-bg); }
  .tile.idle { border-color: var(--s-idle); }
  .tile:hover { background: var(--subtle); }
  .tile .top { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .tile .top .rel { margin-left: auto; }
  .tile .d { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .m { font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .m.use { white-space: nowrap; }

  .state h2:focus { outline: none; }
  .state { margin: auto; max-width: 440px; text-align: center; padding: 40px 24px; font-size: 14px; color: var(--text-2); }
  .state h2 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .state code { display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 6px; background: var(--subtle); border: 1px solid var(--border); color: var(--text); user-select: all; }
  .state.full { grid-column: 1 / -1; }
  .sk { height: 64px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, var(--surface), var(--subtle), var(--surface)); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 820px) {
    header { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
    .summary { order: 5; flex-basis: 100%; margin-left: 0; }
    .banner { padding: 6px 16px; }
    main { grid-template-columns: 1fr; }
    .rail { border-right: 0; }
    main.detail .rail { display: none; }
    main:not(.detail) .panel { display: none; }
    .back { display: inline-block; }
    .panel-head, .seclabel, .thread, .subbar { padding-left: 16px; padding-right: 16px; }
    .badge { margin-left: 0; }
    .props { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .props.cmds { grid-template-columns: minmax(0, 1fr); }
    .panel { overflow-y: auto; } /* the whole panel scrolls once; the timeline keeps a fixed height instead of being squeezed */
    .thread { flex: none; height: 70dvh; }
    .kindrep { display: inline; } /* the list is hidden on a phone, so the badge is not on screen */
    .fleet { padding: 4px 16px 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 26 18" fill="none" aria-hidden="true"><path d="M7 17h13.5a5 5 0 0 0 .6-9.96A7 7 0 0 0 7.6 5.2 6 6 0 0 0 7 17Z" stroke="url(#bg)" stroke-width="1.6"/><defs><linearGradient id="bg" x1="0" x2="26" y1="0" y2="0"><stop stop-color="#0087ff"/><stop offset="1" stop-color="#5fd7ff"/></linearGradient></defs></svg>
    <b>Cloudy Cloud</b>
  </div>
  <div class="summary" id="summary" aria-live="polite">Loading…</div>
  <span class="tag" id="demo" title="Sample data from cloudy-cloud dashboard --demo" hidden>Demo</span>
  <div class="toggle" role="group" aria-label="View">
    <button id="v-list" aria-pressed="true">List</button>
    <button id="v-fleet" aria-pressed="false">Fleet</button>
  </div>
  <div class="live wait" id="live" role="status"><span class="sd running"></span><span id="live-t">Connecting</span></div>
</header>
<div class="banner" id="banner" hidden role="alert"></div>
<main id="main">
  <section class="rail" id="rail" aria-label="Agents"></section>
  <section class="panel" id="panel" aria-label="Agent detail"></section>
</main>

<script>
(() => {
  'use strict';
  const T = new URLSearchParams(location.search).get('t') || '';
  // rail and panel are taken out of the page for full-width states, so keep references to them.
  const kept = { rail: document.getElementById('rail'), panel: document.getElementById('panel') };
  const $ = (id) => kept[id] || document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const ORDER = { idle: 0, running: 1, starting: 2, queued: 3, failed: 4, stopped: 5 };
  const S = { data: null, sel: null, view: 'list', net: null, err: '', lastOk: 0, sigs: {}, kids: {}, collapsed: new Set(), tab: 'activity', turn: {}, metrics: {}, mBusy: false, st: null, pane: null, full: {}, open: new Set(), busyFull: new Set(), failFull: new Set() };
  const enc = encodeURIComponent;
  try { S.view = localStorage.getItem('cc-view') === 'fleet' ? 'fleet' : 'list'; } catch {}

  // Build DOM without innerHTML: every string from the server goes in as text.
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {

      if (r.ok) {
        const j = await r.json(), src = j.source, why = src?.reason; // a failed read is HTTP 200 with source.kind 'none'
        S.pane = { box: id, lines: (j.lines || []).map(str), loaded: true, source: j.source ? { ...j.source, fetchedAt: j.fetchedAt } : null,
          err: src?.kind === 'none' ? (why === 'rate_limited' ? 'The terminal read is rate limited; trying again.' : 'Could not read the terminal (' + (NONE[why]?.[0] || why || 'unknown reason') + '); trying again.') : '' };
      }
      else S.pane = { box: id, lines: [], err: r.status === 404 ? 'No terminal to show: the coordinator machine is not running.' : 'The dashboard server answered HTTP ' + r.status + '; trying again.' };
    } catch { S.pane = { box: id, lines: [], err: 'The dashboard server is not answering; trying again.' }; }
    S.paneBusy = false;
    S.paneT = setTimeout(() => { S.paneT = 0; const b = selBox(); if (b && b.id === id) paneEnsure(b); }, 3000);
    redo();
  }

  function fleetView(boxes) {
    const g = h('div', { class: 'fleet' });
    for (const [name, list] of groupsOf(boxes)) {
      g.append(grp(name, list.length));
      const tile = (b) => h('button', { class: 'tile ' + b.status, 'data-id': b.id, type: 'button', onclick: () => { setView('list'); S.from = 'fleet'; select(b.id, true); $('rail').querySelector('[data-id="' + CSS.escape(b.id) + '"]')?.focus(); } },
        h('span', { class: 'top' }, dot(b.status), h('span', { class: 'st ' + b.status, text: statusWord(b.status) }), quietTag(b), stamp(b) && live('rel', stamp(b), 'rel')),
        h('span', { class: 'd', text: b.title || b.description || label(b) }),
        h('span', { class: 'm', text: b.id + ' · ' + label(b) }), usageLine(b, true) && h('span', { class: 'm use', text: usageLine(b, true) }), soonTag(b));
      g.append(h('div', { class: 'grid', role: 'group', 'aria-label': name }, list.map(tile)));
      for (const c of list) if (S.kids[c.id]) g.append(h('div', { class: 'grp sub2', 'aria-hidden': 'true' }, 'Workers of ' + titleOf(c), h('span', { text: String(S.kids[c.id].length) })), h('div', { class: 'grid', role: 'group', 'aria-label': 'Workers of ' + titleOf(c) }, S.kids[c.id].map(tile)));
    }
    return g;
  }

  // Same sentence as usageLine in src/machine.mjs (a test keeps them equal); null when the figures are missing.
  const usageSentence = (u) => { const n = (x) => typeof x === 'number' && isFinite(x), m = (x) => '$' + x.toFixed(2); if (!u || !n(u.costUSD)) return null; const inc = n(u.allowanceUSD) && u.allowanceUSD > 0 ? u.allowanceUSD : 0; return 'Instabox this month: ' + (!inc ? m(u.costUSD) + ' used (pay as you go)' : n(u.overageUSD) && u.overageUSD > 0 ? m(u.costUSD) + ' used, ' + m(inc) + ' included, ' + m(u.overageUSD) + ' beyond it (pay as you go)' : m(u.costUSD) + ' of ' + m(inc) + ' included used'); };

  // Counts for the top bar and the tab title; returns the two the title needs.
  function summary(boxes) {
    const c = (f) => boxes.filter(f).length;
    const failed = c((b) => b.status === 'failed' && today(b)), idle = c((b) => b.status === 'idle');
    const items = [['running', 'Running', c((b) => b.status === 'running')], ['starting', 'Starting', c((b) => b.status === 'starting' || b.status === 'queued')], ['idle', 'Waiting for you', idle], ['failed', 'Failed', failed]].filter((i) => i[2]);
    items.push(['stopped', 'Finished today', c((b) => b.status === 'stopped' && today(b))]);
    const spend = usageSentence(S.data && S.data.usage);
    put($('summary'), items.map(([st, name, n]) => h('span', { class: 'stat' + (st === 'failed' ? ' failed' : '') }, h('span', { class: 'sd ' + st, style: 'animation:none' }), h('b', { text: String(n) }), name)).concat(spend ? [h('span', { class: 'spend', text: spend })] : []));
    return { failed, idle };
  }

  function banner() {
    const b = $('banner'), d = S.data;
    let node = null;
    if (d && S.net === 'down') node = ['', h('span', {}, 'The dashboard server is not answering. Last update ' + clock(S.lastOk) + ', so the list below may be out of date. To restart it, run ', h('code', { text: 'cloudy-cloud dashboard' }), ' and open the new link it prints.')];
    else if (d && S.net === 'error') node = ['', h('span', {}, 'The dashboard server hit an error (last update ' + clock(S.lastOk) + ', trying again every 3 seconds): ', S.err)];
    else if (d && S.net === 'ok' && d.machines && !d.machines.ok) node = ['warn', h('span', {}, h('b', { text: 'Live machines unavailable. ' }), d.machines.message, d.boxes.length ? ' Session history below still works.' : '', h('span', { class: 'fix', text: 'Fix: ' + d.machines.fix }))];
    b.hidden = !node;
    if (node) { b.className = 'banner ' + node[0]; put(b, node[1]); }
    const pill = { ok: ['Live', 'live'], down: ['Offline', 'live off'], auth: ['Old link', 'live off'], error: ['Error', 'live off'] }[S.net] || ['Connecting', 'live wait'];
    $('live').className = pill[1]; put($('live-t'), pill[0]);
  }

  function render() {
    const d = S.data, main = $('main');
    banner();
    $('demo').hidden = !(d && d.demo);
    const setTitle = (n) => { const parts = []; if (n?.failed) parts.push(n.failed + ' failed'); if (n?.idle) parts.push(n.idle + ' waiting for you'); document.title = ({ down: 'Offline · ', auth: 'Old link · ', error: 'Error · ' }[S.net] || '') + (parts.length ? '(' + parts.join(', ') + ') ' : '') + (d && d.demo ? 'Demo · ' : '') + 'Cloudy Cloud dashboard'; };
    setTitle();
    main.classList.toggle('stale', !!d && S.net !== 'ok');
    $('v-list').setAttribute('aria-pressed', String(S.view === 'list'));
    $('v-fleet').setAttribute('aria-pressed', String(S.view === 'fleet'));
    if (!d) { // loading, or never reached the server
      S.sigs = {};
      if (S.net === null) { put($('summary'), 'Loading…'); $('rail').replaceChildren(h('div', { class: 'sk' }), h('div', { class: 'sk' }), h('div', { class: 'sk' }), h('div', { class: 'sk' })); $('panel').replaceChildren(); }
      else {
        put($('summary'));
        const full = S.net === 'auth' ? [h('h2', { tabindex: '-1', text: 'This link is from an earlier run' }), h('p', { text: 'The dashboard was restarted, and each start makes a new link. Open the newest link in your terminal, or start the dashboard again:' }), h('code', { text: 'cloudy-cloud dashboard' })]
          : S.net === 'error' ? [h('h2', { tabindex: '-1', text: 'The dashboard server hit an error' }), h('p', { text: S.err }), h('p', { text: 'Trying again every 3 seconds.' })]
          : [h('h2', { tabindex: '-1', text: 'The dashboard cannot reach its server' }), h('p', { text: 'Start it again from a terminal and open the new link it prints.' }), h('code', { text: 'cloudy-cloud dashboard' })];
        const had = main.contains(document.activeElement);
        if (put(main, h('div', { class: 'state full' }, full)) && had) main.querySelector('h2').focus();
      }
      return;
    }
    const boxes = [...d.boxes].sort((a, b) => ORDER[a.status] - ORDER[b.status] || (b.startedAt || 0) - (a.startedAt || 0));
    // Workers nest under their coordinator when it is in the list; everything else is top level.
    const ids = new Set(boxes.map((b) => b.id)); S.kids = {};
    for (const b of boxes) if (b.parent && b.parent !== b.id && ids.has(b.parent)) (S.kids[b.parent] ||= []).push(b);
    const roots = boxes.filter((b) => !(b.parent && b.parent !== b.id && ids.has(b.parent)));
    setTitle(boxes.length ? summary(boxes) : undefined);
    if (!boxes.length) {
      put($('summary'));
      const had = main.contains(document.activeElement);
      if (put(main, h('div', { class: 'state full' }, h('h2', { tabindex: '-1', text: 'No cloud boxes yet' }),
        h('p', { text: d.machines.ok ? 'When you start a subagent from a cloudy-cloud session, it appears here with its messages.' : 'Nothing recorded in the session log yet, and live machines could not be listed (see the message above).' }),
        h('code', { text: 'cloudy-cloud' }), h('p', { style: 'margin-top:12px;font-size:13px', text: 'Or look around first with sample data:' }), h('code', { text: 'cloudy-cloud dashboard --demo' }))) && had) main.querySelector('h2').focus();
      return;
    }
    if (!boxes.some((b) => b.id === S.sel)) S.sel = groupsOf(roots)[0][1][0].id;
    const sig = (x) => JSON.stringify(x);
    if (S.view === 'fleet') {
      const f = sig(['f', roots.map((b) => [b.id, b.status, b.description, b.title, b.parent, needsYou(b), soon(b), b.usage?.cpuPct, b.usage?.memUsed, b.usage?.at, isQuiet(b), (S.kids[b.id] || []).map((c) => [c.id, c.status, c.description, c.title, needsYou(c), soon(c), c.usage?.cpuPct, c.usage?.memUsed, c.usage?.at, isQuiet(c)])])]);
      if (S.sigs.f !== f) {
        S.sigs = { f };
        const old = main.querySelector('.fleet'), top = old ? old.scrollTop : 0, fid = document.activeElement?.closest?.('.tile')?.dataset.id;
        main.replaceChildren(fleetView(roots));
        tick(); // fill the live texts first, or they grow the tiles after the scroll is restored
        const nf = main.querySelector('.fleet'); nf.scrollTop = top;
        if (fid) nf.querySelector('[data-id="' + CSS.escape(fid) + '"]')?.focus({ preventScroll: true });
      }
      tick(); return;
    }
    if (!main.contains($('rail'))) { S.sigs = {}; main.replaceChildren($('rail'), $('panel')); }
    const r = sig(['r', S.sel, [...S.collapsed], boxes.map((b) => [b.id, b.status, b.waiting, b.fatal, b.description, b.title, b.note, b.parent, b.startedBy, b.lastActivity, b.deadline, soon(b), needsYou(b), b.machineKind, b.usage?.cpuPct, b.usage?.memUsed, b.usage?.at, isQuiet(b)])]);
    if (S.sigs.r !== r) { S.sigs.r = r; railView(roots); }
    const sb = boxes.find((b) => b.id === S.sel);
    const lm = sb.messages?.at(-1);
    const ps = sig(['p', sb.id, sb.status, sb.title, sb.turns, sb.startedBy, sb.messages?.length, lm?.kind, lm?.text, S.tab, sb.machineKind, sb.machine, sb.source, sb.machineState, sb.usage?.cpuPct, sb.usage?.memUsed, sb.usage?.at, sisQuiet(b), sb.usage?.none, sb.usage?.error?.code, JSON.stringify(S.data.caps)]);
    if (S.sigs.p !== ps) { S.sigs.p = ps; panelView(sb); }
    streamEnsure(sb); paneEnsure(sb); metricsEnsure(sb);
    tick();
  }

  function select(id, open) {
    if (id !== S.sel) S.tab = 'activity';
    S.sel = id; S.sigs = {}; S.sticky = id;
    const par = S.data?.boxes.find((b) => b.id === id)?.parent; if (par) S.collapsed.delete(par);
    if (open) $('main').classList.add('detail');
    // keep keyboard focus on the chosen card after the rail is rebuilt
    render();
    const c = $('rail').querySelector('[data-id="' + CSS.escape(id) + '"]'); if (c && !open) c.focus({ preventScroll: false });
    if (open && matchMedia('(max-width: 820px)').matches) $('panel').querySelector('h1')?.focus();
  }
  function setView(v) {
    S.view = v; S.sigs = {}; S.from = null;
    try { localStorage.setItem('cc-view', v); } catch {}
    $('main').classList.remove('detail');
    render();
  }
  $('v-list').onclick = () => setView('list');
  $('v-fleet').onclick = () => setView('fleet');

  let timer, busy = false;
  async function poll() {
    if (busy) return;
    busy = true; clearTimeout(timer);
    try {
      const r = await fetch('/api/state?t=' + encodeURIComponent(T), { cache: 'no-store', signal: AbortSignal.timeout(15000) });
      if (r.status === 401) { S.net = 'auth'; S.data = null; }
      else if (!r.ok) { S.net = 'error'; S.err = String((await r.json().catch(() => null))?.error || 'HTTP ' + r.status); }
      else { S.data = await r.json(); pruneMetrics(S.metrics, new Set((S.data.boxes || []).map((x) => x.id))); S.skew = S.data.now - Date.now(); S.net = 'ok'; S.lastOk = Date.now(); }
    } catch { S.net = 'down'; }
    busy = false;
    try { render(); } finally { if (S.net !== 'auth') timer = setTimeout(poll, 3000); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.net !== 'auth') poll(); });
  render(); poll(); setInterval(tick, 1000);
})();
</script>
