<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cloudy Cloud dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #f6f5fb; --ink: #16183a; --muted: #5d6185; --faint: #666a8c; --line: rgba(40,44,110,.1);
    --peri: #5867f0; --peri-hi: #6b79ff; --band: #f5f4f9; --surface: #fff; --accent: #5867f0; --code: #eaeaf6; --hl: #eceefe;
    --shadow: 0 1px 2px rgba(40,44,110,.05), 0 8px 24px rgba(40,44,110,.06);
    --dawn: radial-gradient(60% 120% at 12% 0%, rgba(170,190,255,.55), transparent 70%), radial-gradient(50% 120% at 88% 0%, rgba(255,216,196,.7), transparent 70%);
    --s-queued: #7b8099; --s-starting: #b9770e; --s-running: #5867f0; --s-idle: #8a62d8; --s-stopped: #858aa6; --s-failed: #d1323a;
    --bg-queued: #eceef4; --bg-starting: #fdf1d6; --bg-running: #e8ebff; --bg-idle: #f0e9fd; --bg-stopped: #f0f0f6; --bg-failed: #fde8ea;
    --out: #5867f0; --out-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --night: #0b0e24; --band: #0d1029; --surface: #141838; --ink: #eef0ff; --muted: #b4b9dc; --faint: #8a90bd;
      --line: rgba(255,255,255,.08); --accent: #8b96ff; --code: rgba(255,255,255,.09); --hl: #1a1f4a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --dawn: radial-gradient(60% 120% at 12% 0%, rgba(88,103,240,.28), transparent 70%), radial-gradient(50% 120% at 88% 0%, rgba(150,90,170,.2), transparent 70%);
      --s-queued: #98a0c4; --s-starting: #f2b94b; --s-running: #8b96ff; --s-idle: #b79cf5; --s-stopped: #8a90bd; --s-failed: #ff7a82;
      --bg-queued: rgba(152,160,196,.14); --bg-starting: rgba(242,185,75,.15); --bg-running: rgba(139,150,255,.18); --bg-idle: rgba(183,156,245,.16); --bg-stopped: rgba(138,144,189,.12); --bg-failed: rgba(255,122,130,.15);
      --out: #3b45b8; --out-ink: #f4f5ff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--night); }
  body { background: var(--night); color: var(--ink); font: 400 15px/1.55 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono, code { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  header { position: relative; flex: none; display: flex; align-items: center; gap: 20px; padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--dawn), var(--band); }
  .brand { display: flex; align-items: center; gap: 10px; font: 500 18px/1 "Inter Tight", sans-serif; letter-spacing: -.01em; }
  .brand svg { width: 28px; height: 20px; }
  .summary { color: var(--muted); font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary b { color: var(--ink); font-weight: 500; }
  .live { display: inline-flex; align-items: center; gap: 8px; font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #2fb67c; box-shadow: 0 0 0 0 rgba(47,182,124,.5); animation: ping 2.4s ease-out infinite; }
  .live.off .dot { background: var(--s-failed); animation: none; }
  .tag { font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: var(--bg-starting); color: var(--s-starting); border: 1px solid var(--line); }
  .toggle { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .toggle button { height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .toggle button[aria-pressed="true"] { background: var(--peri); color: #fff; box-shadow: 0 4px 14px rgba(88,103,240,.3); }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(47,182,124,0); } 100% { box-shadow: 0 0 0 0 rgba(47,182,124,0); } }

  .banner { flex: none; padding: 10px 28px; font-size: 14px; border-bottom: 1px solid var(--line); background: var(--bg-failed); color: var(--ink); }
  .banner.warn { background: var(--bg-starting); }
  .banner code { background: var(--code); padding: 2px 7px; border-radius: 6px; font-size: 12.5px; user-select: all; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px 1fr; }
  .rail { min-height: 0; overflow-y: auto; padding: 18px 16px 24px 28px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line); }
  .kicker { font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .rail .kicker { padding: 2px 4px 4px; }

  .card { display: block; width: 100%; text-align: left; cursor: pointer; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: border-color .2s, transform .2s; }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent), var(--shadow); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .id { font: 500 13px/1 "JetBrains Mono", monospace; }
  .card .model { margin-left: auto; font: 400 11.5px/1 "JetBrains Mono", monospace; color: var(--faint); max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .desc { margin: 8px 0 10px; font: 500 15px/1.35 "Inter Tight", sans-serif; letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .card .act { margin-top: 8px; font: 400 12px/1.4 "JetBrains Mono", monospace; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .branch { display: inline-flex; align-items: center; gap: 4px; font: 400 12px/1 "JetBrains Mono", monospace; color: var(--muted); min-width: 0; }
  .branch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 8px; color: var(--faint); flex: none; }
  .copy:hover { background: var(--hl); color: var(--accent); }
  .copy svg { width: 14px; height: 14px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .04em; background: var(--bg-stopped); color: var(--s-stopped); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.queued { background: var(--bg-queued); color: var(--s-queued); }
  .pill.starting { background: var(--bg-starting); color: var(--s-starting); }
  .pill.running { background: var(--bg-running); color: var(--s-running); }
  .pill.running::before { animation: pulse 1.8s ease-in-out infinite; }
  .pill.idle { background: var(--bg-idle); color: var(--s-idle); }
  .pill.failed { background: var(--bg-failed); color: var(--s-failed); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent); } 60% { box-shadow: 0 0 0 6px transparent; } }

  .panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .panel-head { flex: none; padding: 20px 32px 16px; border-bottom: 1px solid var(--line); }
  .panel-head h1 { font: 500 24px/1.2 "Inter Tight", sans-serif; letter-spacing: -.02em; margin: 10px 0 10px; }
  .panel-head .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .back { display: none; margin-bottom: 8px; color: var(--accent); font-size: 14px; font-weight: 500; padding: 6px 0; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: min(680px, 86%); display: flex; flex-direction: column; gap: 6px; }
  .msg .who { font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; gap: 10px; }
  .msg .bubble { padding: 12px 16px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .msg.out .bubble { background: var(--out); color: var(--out-ink); border-color: transparent; border-bottom-right-radius: 6px; box-shadow: 0 6px 20px rgba(88,103,240,.22); }
  .msg.reply .bubble { background: var(--surface); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .msg.reply.err .bubble { border-color: var(--s-failed); background: var(--bg-failed); }
  .prog { align-self: stretch; max-width: 680px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--code); font: 400 12.5px/1.6 "JetBrains Mono", monospace; color: var(--muted); }
  .prog div { display: flex; gap: 12px; }
  .prog time { color: var(--faint); flex: none; }
  .prog span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .fleet { grid-column: 1 / -1; overflow-y: auto; padding: 28px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; transition: transform .2s; }
  .tile:hover { transform: translateY(-2px); }
  .tile svg { width: 76px; height: 54px; }
  .tile .id { font: 500 12.5px/1 "JetBrains Mono", monospace; }
  .tile .d { font-size: 12px; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cloud-queued { color: var(--s-queued); } .cloud-starting { color: var(--s-starting); } .cloud-running { color: var(--s-running); } .cloud-idle { color: var(--s-idle); } .cloud-stopped { color: var(--s-stopped); } .cloud-failed { color: var(--s-failed); }
  .cloud-running path { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { fill-opacity: .35; } }

  .state { margin: auto; max-width: 440px; text-align: center; padding: 40px 24px; color: var(--muted); }
  .state h2 { font: 500 24px/1.2 "Inter Tight", sans-serif; letter-spacing: -.02em; color: var(--ink); margin-bottom: 10px; }
  .state code { display: inline-block; margin-top: 14px; padding: 10px 16px; border-radius: 12px; background: var(--code); color: var(--ink); font-size: 13px; user-select: all; }
  .state.full { grid-column: 1 / -1; }
  .sk { height: 112px; border-radius: 16px; background: linear-gradient(90deg, var(--hl), var(--surface), var(--hl)); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; border: 1px solid var(--line); }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 820px) {
    header { flex-wrap: wrap; gap: 10px 14px; padding: 12px 16px; }
    .summary { order: 5; flex-basis: 100%; white-space: normal; }
    .banner { padding: 10px 16px; }
    main { grid-template-columns: 1fr; }
    .rail { border-right: 0; padding: 14px 16px 24px; }
    main.detail .rail { display: none; }
    main:not(.detail) .panel { display: none; }
    .back { display: inline-block; }
    .panel-head, .thread { padding-left: 16px; padding-right: 16px; }
    .panel-head h1 { font-size: 20px; }
    .msg { max-width: 94%; }
    .fleet { padding: 16px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 26 18" fill="none" aria-hidden="true"><path d="M7 17h13.5a5 5 0 0 0 .6-9.96A7 7 0 0 0 7.6 5.2 6 6 0 0 0 7 17Z" stroke="url(#bg)" stroke-width="1.6"/><defs><linearGradient id="bg" x1="0" x2="26" y1="0" y2="0"><stop stop-color="#0087ff"/><stop offset="1" stop-color="#5fd7ff"/></linearGradient></defs></svg>
    Cloudy Cloud
  </div>
  <div class="summary" id="summary" aria-live="polite">Loading…</div>
  <span class="tag" id="demo" hidden>Demo data</span>
  <div class="toggle" role="group" aria-label="View">
    <button id="v-list" aria-pressed="true">List</button>
    <button id="v-fleet" aria-pressed="false">Fleet</button>
  </div>
  <div class="live" id="live" role="status"><span class="dot"></span><span id="live-t">Live</span></div>
</header>
<div class="banner" id="banner" hidden role="alert"></div>
<main id="main">
  <section class="rail" id="rail" aria-label="Boxes"></section>
  <section class="panel" id="panel" aria-label="Messages"></section>
</main>

<script>
(() => {
  'use strict';
  const T = new URLSearchParams(location.search).get('t') || '';
  // rail and panel are taken out of the page for full-width states, so keep references to them.
  const kept = { rail: document.getElementById('rail'), panel: document.getElementById('panel') };
  const $ = (id) => kept[id] || document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const ORDER = { running: 0, starting: 1, queued: 2, idle: 3, failed: 4, stopped: 5 };
  const S = { data: null, sel: null, view: 'list', online: false, loaded: false, sigs: {} };
  try { S.view = localStorage.getItem('cc-view') === 'fleet' ? 'fleet' : 'list'; } catch {}

  // Build DOM without innerHTML: every string from the server goes in as text.
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
    return e;
  };
  const svg = (inner, cls, vb) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', vb); s.setAttribute('aria-hidden', 'true'); if (cls) s.setAttribute('class', cls); s.innerHTML = inner; return s; }; // inner is a constant, never server data
  const copyIcon = () => svg('<g fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="9" height="9" rx="2"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></g>', '', '0 0 16 16');
  const okIcon = () => svg('<path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>', '', '0 0 16 16');
  const cloud = (st) => svg('<path d="M7 17h13.5a5 5 0 0 0 .6-9.96A7 7 0 0 0 7.6 5.2 6 6 0 0 0 7 17Z" fill="currentColor" fill-opacity=".16" stroke="currentColor" stroke-width="1.5"/>', 'cloud-' + st, '0 0 28 20');

  const now = () => Date.now() + (S.skew || 0);
  const dur = (ms) => {
    ms = Math.max(0, ms); const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's'; const m = Math.floor(s / 60);
    if (m < 60) return m + 'm'; const hr = Math.floor(m / 60);
    if (hr < 48) return hr + 'h ' + (m % 60) + 'm'; return Math.floor(hr / 24) + 'd';
  };
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const active = (b) => ['queued', 'starting', 'running'].includes(b.status);
  const label = (b) => b.kind === 'coordinator' ? 'coordinator' : b.profile || (b.model ? b.model.replace(/^claude-/, '') : 'claude');

  function lastAct(b) {
    const m = (b.messages || []).at(-1);
    const t = b.lastActivity || b.startedAt;
    if (!m) return { t, text: b.kind === 'machine' ? 'no session log' : '' };
    return { t, text: m.kind === 'progress' ? m.text : m.kind === 'out' ? 'you: ' + m.text : (m.error ? 'error: ' : 'reply: ') + m.text };
  }
  // Text for one of the live-updating spans (data-live = kind, data-t = timestamp).
  function liveText(el) {
    const t = +el.dataset.t, k = el.dataset.live;
    if (k === 'age') return dur(now() - t);
    if (k === 'ago') return dur(now() - t) + ' ago';
    if (k === 'left') return t - now() > 0 ? dur(t - now()) + ' left' : 'past deadline';
    return '';
  }
  const live = (k, t, cls) => h('span', { 'data-live': k, 'data-t': t, class: cls, text: '' });
  const tick = () => document.querySelectorAll('[data-live]').forEach((el) => { const v = liveText(el); if (el.textContent !== v) el.textContent = v; });

  function copyBtn(text) {
    const b = h('button', { class: 'copy', type: 'button', 'aria-label': 'Copy branch name', title: 'Copy branch name' }, copyIcon());
    b.addEventListener('click', async (e) => {
      e.stopPropagation();
      try { await navigator.clipboard.writeText(text); b.replaceChildren(okIcon()); setTimeout(() => b.replaceChildren(copyIcon()), 1400); } catch { b.title = 'Copy failed: select the branch name instead'; }
    });
    return b;
  }

  function deadlineSpan(b) {
    if (!b.deadline || !(active(b) || b.status === 'idle')) return null;
    return h('span', { title: b.status === 'idle' ? 'The idle agent is stopped and its machine deleted at this time' : 'Latest time the machine is deleted (the 8-hour backstop)' }, live('left', b.deadline));
  }

  function card(b) {
    const a = lastAct(b);
    const el = h('div', { class: 'card', role: 'option', 'data-id': b.id, 'aria-selected': String(b.id === S.sel), tabindex: b.id === S.sel ? '0' : '-1', onclick: () => select(b.id, true),
      onkeydown: (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); select(b.id, true); } } },
      h('div', { class: 'top' }, h('span', { class: 'pill ' + b.status, text: b.status }), h('span', { class: 'id', text: b.id }), h('span', { class: 'model', text: label(b) })),
      h('div', { class: 'desc', text: b.description || '(no description)' }),
      h('div', { class: 'meta' },
        b.branch && h('span', { class: 'branch' }, h('span', { text: b.branch }), copyBtn(b.branch)),
        b.startedAt && h('span', {}, 'age ', live('age', b.startedAt)),
        deadlineSpan(b)),
      a.text && h('div', { class: 'act' }, live('ago', a.t), ' · ', a.text));
    // The copy control is a sibling button inside the card's row, not nested in the card button.
    return el;
  }

  function railView(boxes) {
    const rail = $('rail');
    const focusId = document.activeElement?.closest?.('[data-id]')?.dataset.id;
    const top = rail.scrollTop;
    const wrap = h('div', { role: 'listbox', 'aria-label': 'Boxes', style: 'display:flex;flex-direction:column;gap:10px' });
    wrap.addEventListener('keydown', listKeys);
    const groups = [['Active', boxes.filter((b) => active(b) || b.status === 'idle')], ['Finished', boxes.filter((b) => !active(b) && b.status !== 'idle')]];
    const frag = [];
    for (const [name, list] of groups) {
      if (!list.length) continue;
      frag.push(h('div', { class: 'kicker', role: 'presentation', text: name + ' · ' + list.length }));
      for (const b of list) frag.push(card(b));
    }
    wrap.append(...frag);
    rail.replaceChildren(wrap);
    rail.scrollTop = top;
    if (focusId) wrap.querySelector('[data-id="' + CSS.escape(focusId) + '"]')?.focus({ preventScroll: true });
    tick();
  }
  function listKeys(e) {
    const cards = [...e.currentTarget.querySelectorAll('.card')];
    const i = cards.indexOf(document.activeElement);
    let n = -1;
    if (e.key === 'ArrowDown') n = Math.min(cards.length - 1, i + 1); else if (e.key === 'ArrowUp') n = Math.max(0, i - 1);
    else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = cards.length - 1;
    if (n < 0) return;
    e.preventDefault();
    cards.forEach((c, j) => c.tabIndex = j === n ? 0 : -1);
    cards[n].focus(); select(cards[n].dataset.id, false);
  }

  function panelView(b) {
    const p = $('panel');
    if (!b) { p.replaceChildren(h('div', { class: 'state' }, h('h2', { text: 'Select a box' }), h('p', { text: 'Pick an agent on the left to read its messages.' }))); return; }
    const old = p.querySelector('.thread');
    const stick = !old || old.scrollHeight - old.scrollTop - old.clientHeight < 60 || S.sticky === b.id;
    const keep = old ? old.scrollTop : 0;
    const kids = [];
    let run = null;
    for (const m of b.messages || []) {
      if (m.kind === 'progress') {
        if (!run) { run = h('div', { class: 'prog', 'aria-label': 'Progress' }); kids.push(run); }
        run.append(h('div', {}, h('time', { class: 'mono', text: clock(m.t) }), h('span', { text: m.text })));
        continue;
      }
      run = null;
      const out = m.kind === 'out';
      kids.push(h('div', { class: 'msg ' + (out ? 'out' : 'reply') + (m.error ? ' err' : '') },
        h('div', { class: 'who' }, h('span', { text: out ? 'You' : (b.id) }), h('time', { text: clock(m.t) })),
        h('div', { class: 'bubble', text: m.text })));
    }
    if (!kids.length) kids.push(h('div', { class: 'state' }, h('p', { text: b.kind === 'agent' ? 'No messages recorded for this agent.' : 'No session messages: this box is not tracked by a session log on this computer.' })));
    const head = h('div', { class: 'panel-head' },
      h('button', { class: 'back', type: 'button', onclick: () => { $('main').classList.remove('detail'); } }, '← All boxes'),
      h('div', { class: 'kicker', text: b.kind === 'agent' ? 'Subagent' : b.kind }),
      h('h1', { text: b.description || b.id }),
      h('div', { class: 'row' }, h('span', { class: 'pill ' + b.status, text: b.status }), h('span', { class: 'mono', text: b.id }), h('span', { text: label(b) }),
        b.branch && h('span', { class: 'branch' }, h('span', { text: b.branch }), copyBtn(b.branch)),
        b.startedAt && h('span', {}, 'age ', live('age', b.startedAt)), deadlineSpan(b),
        b.sessionEnded && h('span', { text: 'session ended' })));
    const thread = h('div', { class: 'thread', tabindex: '0', 'aria-label': 'Message thread' }, kids);
    p.replaceChildren(head, thread);
    thread.scrollTop = stick ? thread.scrollHeight : keep;
    S.sticky = null; tick();
  }

  function fleetView(boxes) {
    const g = h('div', { class: 'fleet', role: 'list', 'aria-label': 'Fleet' });
    for (const b of boxes) g.append(h('button', { class: 'tile', type: 'button', role: 'listitem', title: b.id + ': ' + b.status, onclick: () => { select(b.id, true); setView('list'); } },
      cloud(b.status), h('span', { class: 'id', text: b.id }), h('span', { class: 'pill ' + b.status, text: b.status }), h('span', { class: 'd', text: b.description || label(b) })));
    return g;
  }

  function summary(boxes) {
    const c = (f) => boxes.filter(f).length, day = new Date().setHours(0, 0, 0, 0);
    const parts = [['running', c((b) => b.status === 'running')], ['starting or queued', c((b) => b.status === 'starting' || b.status === 'queued')], ['idle', c((b) => b.status === 'idle')]]
      .filter(([, n]) => n);
    const done = c((b) => (b.status === 'stopped' || b.status === 'failed') && (b.stoppedAt || b.lastActivity || 0) >= day);
    const el = h('span');
    const items = [...parts, ['stopped today', done]];
    items.forEach(([k, n], i) => { if (i) el.append(' · '); el.append(h('b', { text: String(n) }), ' ' + k); });
    $('summary').replaceChildren(el);
  }

  function banner() {
    const b = $('banner'), d = S.data;
    let node = null;
    if (!S.online) node = ['', h('span', {}, 'Cannot reach the dashboard server (is it still running?). Showing the last data. Restart it with ', h('code', { text: 'cloudy-cloud dashboard' }), '.')];
    else if (d && d.machines && !d.machines.ok) node = ['warn', h('span', {}, 'Live machines unavailable: ' + d.machines.message + ' ', h('br'), 'Fix: ' + d.machines.fix + ' Session history below still works.')];
    b.hidden = !node;
    if (node) { b.className = 'banner ' + node[0]; b.replaceChildren(node[1]); }
    $('live').classList.toggle('off', !S.online);
    $('live-t').textContent = S.online ? 'Live' : 'Offline';
  }

  function render() {
    const d = S.data, main = $('main');
    banner();
    $('demo').hidden = !(d && d.demo);
    document.title = (d && d.demo ? 'Demo · ' : '') + 'Cloudy Cloud dashboard';
    $('v-list').setAttribute('aria-pressed', String(S.view === 'list'));
    $('v-fleet').setAttribute('aria-pressed', String(S.view === 'fleet'));
    if (!d) { // loading, or never reached the server
      if (!S.loaded && S.online !== false) { $('summary').textContent = 'Loading…'; $('rail').replaceChildren(h('div', { class: 'sk' }), h('div', { class: 'sk' }), h('div', { class: 'sk' })); $('panel').replaceChildren(); }
      else { $('summary').textContent = 'Offline'; main.replaceChildren(h('div', { class: 'state full' }, h('h2', { text: 'The dashboard cannot reach its server' }), h('p', { text: 'Start it again from a terminal and open the new link it prints.' }), h('code', { text: 'cloudy-cloud dashboard' }))); }
      return;
    }
    const boxes = [...d.boxes].sort((a, b) => ORDER[a.status] - ORDER[b.status] || (b.startedAt || 0) - (a.startedAt || 0));
    summary(boxes);
    if (!boxes.length) {
      main.replaceChildren(h('div', { class: 'state full' }, h('h2', { text: 'No cloud boxes yet' }),
        h('p', { text: d.machines.ok ? 'When you start a subagent from a cloudy-cloud session, it appears here with its messages.' : 'Nothing recorded in the session log, and live machines could not be listed.' }),
        h('code', { text: 'cloudy-cloud' }), h('p', { style: 'margin-top:14px;font-size:13px', text: 'Or look around first: cloudy-cloud dashboard --demo' })));
      return;
    }
    if (!boxes.some((b) => b.id === S.sel)) S.sel = boxes[0].id;
    const sig = (x) => JSON.stringify(x);
    if (S.view === 'fleet') {
      const f = sig(['f', boxes.map((b) => [b.id, b.status, b.description])]);
      if (S.sigs.f !== f) { S.sigs = { f }; main.replaceChildren(fleetView(boxes)); }
      tick(); return;
    }
    if (!main.contains($('rail'))) { S.sigs = {}; main.replaceChildren($('rail'), $('panel')); }
    const r = sig(['r', S.sel, boxes.map((b) => [b.id, b.status, b.description, b.lastActivity, b.deadline])]);
    if (S.sigs.r !== r) { S.sigs.r = r; railView(boxes); }
    const sb = boxes.find((b) => b.id === S.sel);
    const ps = sig(['p', sb.id, sb.status, sb.messages?.length, sb.lastActivity]);
    if (S.sigs.p !== ps) { S.sigs.p = ps; panelView(sb); }
    tick();
  }

  function select(id, open) {
    S.sel = id; S.sigs = {}; S.sticky = id;
    if (open) $('main').classList.add('detail');
    // keep keyboard focus on the chosen card after the rail is rebuilt
    render();
    const c = $('rail').querySelector('[data-id="' + CSS.escape(id) + '"]'); if (c && !open) c.focus({ preventScroll: false });
  }
  function setView(v) {
    S.view = v; S.sigs = {};
    try { localStorage.setItem('cc-view', v); } catch {}
    $('main').classList.remove('detail');
    render();
  }
  $('v-list').onclick = () => setView('list');
  $('v-fleet').onclick = () => setView('fleet');

  async function poll() {
    try {
      const r = await fetch('/api/state?t=' + encodeURIComponent(T), { cache: 'no-store' });
      if (r.status === 401) throw new Error('token');
      if (!r.ok) throw new Error('http ' + r.status);
      S.data = await r.json(); S.skew = S.data.now - Date.now(); S.online = true; S.loaded = true;
    } catch (e) {
      S.online = false; S.loaded = true;
      if (e.message === 'token') S.data = null;
    }
    render();
  }
  poll(); setInterval(poll, 3000); setInterval(tick, 1000);
})();
</script>
</body>
</html>
